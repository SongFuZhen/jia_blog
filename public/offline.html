<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>离线中 · 小佳佳的生活日记</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fdf9f7;
      font-family: "LXGW WenKai Lite", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #3b2e2a;
      text-align: center;
    }
    .card { padding: 40px 28px; }
    .emoji { font-size: 48px; }
    h1 { font-size: 18px; margin: 16px 0 8px; }
    p { font-size: 13px; color: #a8928b; margin: 0 0 20px; line-height: 1.7; }
    button {
      border: 0;
      background: #e96882;
      color: #fff;
      font-size: 14px;
      padding: 10px 28px;
      border-radius: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">📡</div>
    <h1>网络开小差了</h1>
    <p>现在连不上小站，<br />等网络恢复后再来看看吧。</p>
    <button onclick="location.reload()">重新试试</button>
  </div>
</body>
</html>
